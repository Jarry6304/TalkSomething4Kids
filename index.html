<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>零碎時間問答練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
  :root { --ink: #33302c; --muted: #6b665e; --line: #e8e1d3; --paper: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: 'Huninn', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 3px solid #6EA9E0; outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  .hidden { display: none !important; }

  /* home */
  .hero { display: flex; align-items: center; gap: 12px; margin: 8px 0 6px; }
  .hero h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: 1px; }
  .hero p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .rules { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
  .rules span { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 10px 14px; border-radius: 22px; border: 2.5px solid var(--tile-line); background: var(--tile-fill); min-height: 150px; text-align: center; transition: transform .12s ease; }
  .tile:active { transform: scale(.97); }
  .tile svg { width: 56px; height: 56px; }
  .tile .name { font-size: 20px; font-weight: 700; }
  .tile .tip { font-size: 12px; color: var(--tile-ink); font-weight: 700; }
  .tile .count { font-size: 11px; color: var(--muted); }
  .foot { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }

  /* slot */
  .top { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: var(--muted); padding: 8px 10px 8px 4px; border-radius: 999px; }
  .top .ttl { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; margin-left: auto; }
  .top .ttl svg { width: 34px; height: 34px; }
  .tipbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; background: var(--s-fill); border: 2px solid var(--s-line); font-size: 14px; margin-bottom: 12px; }
  .tipbar b { color: var(--s-ink); white-space: nowrap; }
  .track { display: flex; gap: 4px; margin: 0 2px 10px; }
  .track span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .track span.on { background: var(--s-line); }
  .track span.cur { background: var(--s-ink); }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin: 0 4px 6px; }
  .meta .kind { font-weight: 700; }
  .meta .kind.open { color: var(--s-ink); }
  .meta .tag { font-weight: 700; color: var(--s-ink); background: var(--s-fill); padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .card { position: relative; border: 2.5px solid var(--s-line); border-radius: 24px; background: #fff; padding: 22px 22px 22px; min-height: 160px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .card .chain { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--s-ink); }
  .card .chain .dots { display: flex; gap: 4px; }
  .card .chain .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--s-fill); border: 1.5px solid var(--s-line); }
  .card .chain .dots i.on { background: var(--s-line); }
  .card .q { font-size: 24px; line-height: 1.45; font-weight: 700; text-wrap: balance; }
  .card.say { background: var(--s-fill); }
  .card.say .q { font-size: 21px; }
  .card .tail { position: absolute; left: 34px; bottom: -11px; width: 20px; height: 20px; background: #fff; border-right: 2.5px solid var(--s-line); border-bottom: 2.5px solid var(--s-line); transform: rotate(45deg); }
  .card.say .tail { background: var(--s-fill); }
  .helpers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
  .helper { padding: 12px; border-radius: 16px; border: 2px dashed var(--s-line); background: #fff; text-align: left; min-height: 52px; }
  .helper .lbl { font-size: 12px; font-weight: 700; color: var(--s-ink); display: flex; align-items: center; gap: 6px; }
  .helper .lbl svg { width: 16px; height: 16px; flex: none; }
  .helper .body { font-size: 15px; margin-top: 6px; display: none; line-height: 1.4; }
  .helper.open { background: var(--s-fill); border-style: solid; }
  .helper.open .body { display: block; }
  .helper .body ol { margin: 0; padding-left: 18px; }
  .helper .body .extra { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .helper .body .extra b { color: var(--s-ink); }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .count5 { flex: none; width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--s-line); background: #fff; font-size: 13px; font-weight: 700; color: var(--s-ink); display: flex; align-items: center; justify-content: center; line-height: 1.1; text-align: center; }
  .count5.run { background: var(--s-fill); font-size: 30px; }
  .count5.done { background: var(--s-line); color: #fff; font-size: 13px; }
  .next { flex: 1; height: 60px; border-radius: 18px; background: var(--s-line); color: #fff; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.12); padding: 0 12px; }
  .next:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .sub { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .sub button { padding: 8px 10px; border-radius: 999px; font-weight: 700; color: var(--muted); }
  .sub button.on { background: var(--s-fill); color: var(--s-ink); }
  .list { margin-top: 10px; border: 2px solid var(--line); border-radius: 18px; padding: 4px 14px 8px; }
  .list h4 { margin: 10px 0 2px; font-size: 12px; color: var(--s-ink); }
  .list .row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1.5px dashed var(--line); font-size: 15px; align-items: flex-start; }
  .list .row:last-child { border-bottom: 0; }
  .list .row .n { flex: none; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--s-fill); color: var(--s-ink); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .list .row.done { color: var(--muted); }
  .list .row.cur .n { background: var(--s-line); color: #fff; }
  .list .row.spare { color: var(--muted); }
  .list .row button { text-align: left; flex: 1; }
</style>
</head>
<body>

<main id="home" class="wrap">
  <div class="hero">
    <svg width="64" height="44" viewBox="0 0 64 44" role="img" aria-label="微笑的小汽車"><path d="M8 30L14 16Q16 12 20 12H44Q48 12 50 16L56 30H8Z" fill="#FFDADA" stroke="#E57B7B" stroke-width="2.5" stroke-linejoin="round"/><rect x="4" y="28" width="56" height="10" rx="5" fill="#E57B7B"/><circle cx="18" cy="38" r="5" fill="#33302c"/><circle cx="46" cy="38" r="5" fill="#33302c"/><circle cx="18" cy="38" r="2" fill="#fff"/><circle cx="46" cy="38" r="2" fill="#fff"/><circle cx="25" cy="21" r="3.5" fill="#33302c"/><circle cx="39" cy="21" r="3.5" fill="#33302c"/><circle cx="26.2" cy="19.8" r="1.2" fill="#fff"/><circle cx="40.2" cy="19.8" r="1.2" fill="#fff"/><circle cx="19" cy="25" r="2" fill="#F7A8A8"/><circle cx="45" cy="25" r="2" fill="#F7A8A8"/><path d="M28 25Q32 29 36 25" stroke="#33302c" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div>
      <h1>零碎時間 問答練習</h1>
      <p>每段：固定開場 → 今天抽到的補充 → 收尾</p>
    </div>
  </div>
  <div class="rules">
    <span style="background:#D6EAFF;color:#2f6fa8">問完數到五</span>
    <span style="background:#D5F3E0;color:#2e7d4f">不知道 → 給他幾個選</span>
    <span style="background:#E7DCF8;color:#6a4fb8">沉默兩次，今天這段停</span>
  </div>
  <div class="grid" id="tiles"></div>
  <p class="foot">他說了一個詞就擴句再追問；他反問「為什麼」就真解釋兩句，再問「你覺得呢？」</p>
</main>

<main id="slot" class="wrap hidden">
  <div class="top">
    <button class="back" id="back" aria-label="回主頁"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>主頁</button>
    <div class="ttl"><span id="slotIcon"></span><span id="slotName"></span></div>
  </div>
  <div class="tipbar"><b>一招</b><span id="slotTip"></span></div>
  <div class="track" id="track"></div>
  <div class="meta"><span class="kind" id="kind"></span><span class="tag" id="tag"></span></div>
  <div class="card" id="card"><div class="chain hidden" id="chainHead"></div><div class="q" id="q"></div><div class="tail"></div></div>
  <div class="helpers">
    <button class="helper" id="hAlt" aria-expanded="false">
      <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V10M12 10L5 4M12 10l7-6M12 10v0"/></svg><span id="altLbl">不知道 → 給他幾個選</span></span>
      <span class="body" id="alt"></span>
    </button>
    <button class="helper" id="hMore" aria-expanded="false">
      <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6"/></svg><span id="moreLbl">說了 → 追問</span></span>
      <span class="body" id="more"></span>
    </button>
  </div>
  <div class="actions">
    <button class="count5" id="count5" aria-label="數到五">數到<br>五</button>
    <button class="next" id="next">下一題</button>
  </div>
  <div class="sub">
    <button id="draw">再抽一題補充</button>
    <button id="toggleList">看全部題目</button>
    <button id="reshuffle">重新洗牌</button>
  </div>
  <div class="list hidden" id="list"></div>
</main>

<script>
(function () {
  'use strict';

  var ICONS = {
    wake: '<svg viewBox="0 0 24 24" fill="none" stroke="#8a6400" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#FFF1B8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="10.3" cy="11.2" r=".9" fill="#8a6400"/><circle cx="13.7" cy="11.2" r=".9" fill="#8a6400"/><path d="M10.4 13.6q1.6 1.3 3.2 0"/></svg>',
    school: '<svg viewBox="0 0 24 24" fill="none" stroke="#2f6fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15l2-6a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 9l2 6v3H3z" fill="#D6EAFF"/><circle cx="7.5" cy="18" r="1.6" fill="#fff"/><circle cx="16.5" cy="18" r="1.6" fill="#fff"/><circle cx="9.5" cy="11.5" r="1" fill="#2f6fa8"/><circle cx="14.5" cy="11.5" r="1" fill="#2f6fa8"/><path d="M10.5 14q1.5 1.2 3 0"/></svg>',
    pickup: '<svg viewBox="0 0 24 24" fill="none" stroke="#2e7d4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="14" height="14" rx="4" fill="#D5F3E0"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/><circle cx="9.5" cy="12" r="1" fill="#2e7d4f"/><circle cx="14.5" cy="12" r="1" fill="#2e7d4f"/><path d="M10 15q2 1.6 4 0"/></svg>',
    meal: '<svg viewBox="0 0 24 24" fill="none" stroke="#b8484b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="#FFDADA"/><path d="M3 4v5M3 9v11M21 4c-2 1-2 4-2 6v10"/><circle cx="9.5" cy="11" r="1" fill="#b8484b"/><circle cx="14.5" cy="11" r="1" fill="#b8484b"/><path d="M9.8 14q2.2 1.8 4.4 0"/></svg>',
    bath: '<svg viewBox="0 0 24 24" fill="none" stroke="#237a84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#D3F0F3"/><path d="M6 12V6a2 2 0 0 1 4 0"/><path d="M7 19l-1 2M17 19l1 2"/><circle cx="14" cy="6" r="1.4"/><circle cx="18" cy="8.5" r="1"/><circle cx="16.5" cy="3.5" r=".8"/><circle cx="9.5" cy="15" r=".9" fill="#237a84"/><circle cx="14.5" cy="15" r=".9" fill="#237a84"/><path d="M10.2 17q1.8 1.2 3.6 0"/></svg>',
    bed: '<svg viewBox="0 0 24 24" fill="none" stroke="#6a4fb8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#E7DCF8"/><path d="M11 12.5q1.2 1.2 2.4 0"/><path d="M15 4h3l-3 3h3"/><path d="M4.5 3.5l.7 1.5 1.6.2-1.2 1.1.3 1.6-1.4-.8-1.4.8.3-1.6L2.2 5.2l1.6-.2z" fill="#6a4fb8" stroke="none"/></svg>'
  };

  // 結構：open = 每日固定開場（照順序）；pool = 補充題（每天抽 4 題）；close = 固定收尾
  // 單題 { q, tag, alt, more? }；鏈 { chain, tag, steps:[{q, alt, more?}] } 整組照順序出，不拆
  // alt = 他說不知道時給的選項（三選＋「還是別的」）；probes = 這個時段每題都用的追問；more = 這題專屬再追問
  var SLOTS = [
    {
      id: 'wake', name: '起床', tip: '先旁白一句不問；他動手了再問計畫', fill: '#FFF1B8', line: '#E3B341', ink: '#8a6400',
      probes: ['第一步先做什麼？', '然後呢？', '為什麼這樣排？'],
      open: [
        { q: '（先旁白，不問）「你在接紅色那塊，看起來是車的前面。」然後等他開口。', tag: '旁白', say: true, alt: '他沒接話 → 再旁白一句就好：「你把它放在最上面了。」還是沒說，今天不問。', more: ['他說了任何一個詞 → 擴成完整句再追問一個'] },
        { q: '你今天要蓋什麼？第一塊要放哪裡？', tag: '計畫', alt: '蓋車子、蓋房子、蓋停車場，還是別的？', more: ['蓋好之後它要去哪裡？'] }
      ],
      pool: [
        { q: '起床之後第一件事要做什麼？再來呢？', tag: '順序', alt: '上廁所、喝水、換衣服，先哪個？', more: ['最後一件是什麼？'] },
        { q: '今天想穿哪一件衣服？為什麼選這件？', tag: '選擇', alt: '藍色那件、有車車那件，還是你自己挑一件？', more: ['這件哪裡最好看？'] },
        { q: '今天早上想先玩樂高、陀螺，還是著色？為什麼？', tag: '選擇', alt: '樂高、陀螺、著色，先哪個？', more: ['要玩多久？時鐘走到哪裡要停？'] },
        { q: '這台車蓋好要去哪裡比賽？對手是誰？', tag: '想像', alt: '山上、海邊、停車場，還是別的地方？', more: ['你猜誰會贏？為什麼？'] },
        { chain: '陀螺實驗', tag: '預測', steps: [
          { q: '兩顆陀螺一起轉，你猜哪一顆轉比較久？為什麼？', alt: '大的那顆、小的那顆，還是一樣久？' },
          { q: '轉完了！跟你猜的一樣嗎？為什麼？', alt: '一樣、不一樣，還是差一點點？' },
          { q: '怎麼讓輸的那顆轉更久？再試一次看看。', alt: '用力一點、換地板、還是換發射器？' }
        ] },
        { q: '為什麼陀螺轉一轉會停下來？', tag: '為什麼', alt: '是沒力氣了、碰到東西了，還是地板太滑？', more: ['怎麼讓它轉更久？'] },
        { q: '如果樂高的輪子是方形的，車子會怎樣？', tag: '如果', alt: '會跑得動、會卡住，還是會跳？', more: ['為什麼圓的可以滾？'] },
        { q: '襪子要先穿哪一隻？為什麼？', tag: '選擇', alt: '左腳、右腳，還是一起？', more: ['兩隻襪子一樣嗎？哪裡一樣？'] },
        { q: '著色畫這台車你想塗什麼顏色？為什麼選這個？', tag: '選擇', alt: '紅色、藍色、黃色，還是混色？', more: ['你看過什麼車是這個顏色？'] },
        { q: '積木掉在地上找不到，你會怎麼找？', tag: '解決', alt: '先看桌子下、沙發下，還是妹妹手上？', more: ['還有哪裡可能？'] },

        { q: '幫你的陀螺取個名字！它的必殺技是什麼？', tag: '想像', alt: '叫閃電、火焰、鋼鐵，還是你自己取？', more: ['必殺技要怎麼使出來？'] },

        { q: '陀螺發射器要怎麼拉才會轉最快？你來教我。', tag: '小老師', alt: '用力拉、慢慢拉，還是拉到一半？', more: ['試試看，跟你說的一樣嗎？'] },

        { q: '在水裡抬腳，會比在外面輕還是重？', tag: '預測', alt: '比較輕、比較重，還是一樣？', more: ['那手呢？'] },
        { q: '海綿吸飽水之後，壓它會怎樣？', tag: '預測', alt: '水跑出來、變扁，還是都有？', more: ['放開之後呢？'] },
        { q: '兩個杯子，一個裝滿、一個裝一半，倒進浴缸哪個倒比較久？', tag: '預測', alt: '滿的、一半的，還是一樣？', more: ['為什麼？'] },
        { q: '蓮蓬頭的水，手放近跟放遠，哪個比較有力？', tag: '預測', alt: '近的、遠的，還是一樣？', more: ['為什麼？'] }
      ],
      close: [
        { q: '擦乾、穿衣服、刷牙，哪個先？為什麼？', tag: '順序', alt: '擦乾、穿衣服、刷牙，先哪個？', more: ['順序換了會怎樣？'] }
      ]
    },
    {
      id: 'bed', name: '睡前', tip: '故事四問整組問完；一本書照讀前、讀中、讀後；他睏了就停', fill: '#E7DCF8', line: '#9C85D6', ink: '#6a4fb8',
      probes: ['然後呢？', '他那時候覺得怎樣？', '為什麼？'],
      open: [
        { chain: '共編故事', tag: '故事', steps: [
          { q: '今天的故事主角是一台什麼車？它叫什麼名字？住在哪裡？', alt: '賽車、卡車、消防車，還是別的？' },
          { q: '它今天遇到什麼麻煩？在哪裡發生的？', alt: '輪子掉了、迷路了、沒油了，還是別的？' },
          { q: '它想了什麼辦法？', alt: '找朋友幫忙、自己修、去修車廠，還是別的？' },
          { q: '最後呢？成功之後它跟誰說？', alt: '媽媽、朋友，還是陀螺？', more: ['明天它想做什麼？'] }
        ] },
        { chain: '一本書', tag: '讀書', steps: [
          { q: '（看封面）你猜這本書在講什麼？', alt: '動物的、車子的、小朋友的，還是別的？' },
          { q: '（讀到一半）接下來會發生什麼事？', alt: '他會跑掉、留下來、找人幫忙，還是別的？' },
          { q: '（書裡的人）他為什麼哭？為什麼生氣？為什麼笑？', alt: '東西不見了、被罵了、太開心了，還是別的？' },
          { q: '（讀完）你講一次這本書給我聽！他漏的不補。', alt: '從開頭講、從最好笑的地方講，還是從結尾講？' },
          { q: '如果你是他，你會怎麼做？', alt: '跟他一樣、不一樣，還是先問別人？' }
        ] }
      ],
      pool: [
        { q: '今天有沒有一件事讓你覺得「我好棒」？', tag: '心情', alt: '學校的、家裡的、路上的，哪一件？', more: ['你是怎麼做到的？'] },
        { q: '今天誰對你最好？你想跟他說什麼？', tag: '心情', alt: '媽媽、爸爸、爺爺奶奶，還是別人？', more: ['明天要怎麼跟他說？'] },
        { q: '關燈之後房間會變怎樣？你還看得到什麼？', tag: '觀察', alt: '全黑、有一點點亮，還是看得到影子？', more: ['亮的是從哪裡來的？'] },
        { q: '今天有什麼事，你明天想做得不一樣？', tag: '回憶', alt: '學校的、家裡的，還是跟妹妹的事？', more: ['要怎麼做？'] },
        { q: '幫今天打分數，一到十分，你給幾分？為什麼？', tag: '選擇', alt: '比五分多、比五分少，還是剛好五分？', more: ['什麼事讓它少了幾分？'] },
        { q: '妹妹今天做了什麼好笑的事？', tag: '回憶', alt: '吃東西的時候、玩的時候、洗澡的時候，還是別的？', more: ['你那時候在哪裡？'] },
        { q: '今天晚上你想夢到什麼？夢裡要去哪裡？', tag: '想像', alt: '車車比賽、學校、海邊，還是別的？', more: ['要帶誰一起去？'] },
        { q: '關燈之後，眼睛要等多久才看得到東西？我們數數看。', tag: '預測', alt: '數到五、數到十，還是更久？', more: ['為什麼要等？'] },
        { q: '故事裡的那台車，明天會遇到什麼新的事？', tag: '故事', alt: '新朋友、新麻煩，還是去新的地方？', more: ['它會怎麼辦？'] },
        { q: '今天誰說了一句讓你記得的話？是什麼？', tag: '回憶', alt: '老師說的、同學說的，還是爸媽說的？', more: ['為什麼記得這句？'] },
        { q: '今天有沒有一件事，做完覺得「下次還要再做」？', tag: '回憶', alt: '學校的、家裡的，還是路上的？', more: ['下次要怎麼做更好？'] }
      ],
      close: [
        { q: '今天三件事：你講第一件，我講第二件，第三件誰講？', tag: '回憶', alt: '早上的、學校的、晚上的，先講哪個？', more: ['哪一件最想明天再做一次？'] },
        { q: '明天早上你想先玩什麼？要準備什麼？', tag: '計畫', alt: '樂高、陀螺、著色，還是別的？', more: ['現在要先放在哪裡？'] }
      ]
    }
  ];

  var DRAW = 4; // 每天抽幾題補充
  var $ = function (id) { return document.getElementById(id); };
  var home = $('home'), slotEl = $('slot');
  var st = { slot: null, seq: [], pos: 0, step: 0, pool: [], listOpen: false };
  var timer = null;

  function store(key, val) {
    try { if (val === undefined) { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; }
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function key(s) { return 'qa2-' + s.id + '-' + today(); }
  function shuffle(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
  function findSlot(id) { for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i].id === id) return SLOTS[i]; return null; }
  function stepsOf(item) { return item.steps ? item.steps.length : 1; }
  function countAll(s) { var n = 0; [].concat(s.open, s.pool, s.close).forEach(function (it) { n += stepsOf(it); }); return n; }

  // ---------- home ----------
  function renderHome() {
    var tiles = $('tiles'); tiles.innerHTML = '';
    SLOTS.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'tile';
      b.style.setProperty('--tile-fill', s.fill); b.style.setProperty('--tile-line', s.line); b.style.setProperty('--tile-ink', s.ink);
      var fixedN = 0; s.open.concat(s.close).forEach(function (it) { fixedN += stepsOf(it); });
      b.innerHTML = ICONS[s.id] + '<span class="name">' + s.name + '</span><span class="tip">' + s.tip.split('；')[0] + '</span><span class="count">' + countAll(s) + ' 題 · 每日固定 ' + fixedN + '</span>';
      b.addEventListener('click', function () { location.hash = '#/' + s.id; });
      tiles.appendChild(b);
    });
  }

  // ---------- sequence ----------
  function buildSeq(s, poolIdx) {
    var seq = [];
    s.open.forEach(function (it, i) { seq.push({ kind: 'open', item: it, i: i }); });
    poolIdx.forEach(function (pi) { seq.push({ kind: 'pool', item: s.pool[pi], i: pi }); });
    s.close.forEach(function (it, i) { seq.push({ kind: 'close', item: it, i: i }); });
    return seq;
  }
  function openSlot(id) {
    var s = findSlot(id); if (!s) { location.hash = ''; return; }
    st.slot = s;
    var saved = store(key(s));
    if (saved && saved.pool) { st.pool = saved.pool; st.pos = saved.pos || 0; st.step = saved.step || 0; }
    else { st.pool = shuffle(s.pool.length).slice(0, DRAW); st.pos = 0; st.step = 0; }
    st.seq = buildSeq(s, st.pool);
    if (st.pos >= st.seq.length) { st.pos = 0; st.step = 0; }
    st.listOpen = false; $('list').classList.add('hidden'); $('toggleList').classList.remove('on'); $('toggleList').textContent = '看全部題目';
    slotEl.style.setProperty('--s-fill', s.fill); slotEl.style.setProperty('--s-line', s.line); slotEl.style.setProperty('--s-ink', s.ink);
    $('slotIcon').innerHTML = ICONS[s.id]; $('slotName').textContent = s.name; $('slotTip').textContent = s.tip;
    home.classList.add('hidden'); slotEl.classList.remove('hidden');
    window.scrollTo(0, 0);
    render();
  }
  function save() { if (st.slot) store(key(st.slot), { pool: st.pool, pos: st.pos, step: st.step }); }
  function cur() { return st.seq[st.pos]; }
  function curQ() { var e = cur(); return e.item.steps ? e.item.steps[st.step] : e.item; }

  var KIND = { open: '每日開場', pool: '今天補充', close: '收尾' };
  function kindLabel(e) {
    var same = st.seq.filter(function (x) { return x.kind === e.kind; });
    var n = same.indexOf(e) + 1;
    return KIND[e.kind] + ' ' + n + '/' + same.length;
  }

  function render() {
    var s = st.slot, e = cur(), item = e.item, q = curQ();
    // track
    var tr = $('track'); tr.innerHTML = '';
    st.seq.forEach(function (x, i) { var sp = document.createElement('span'); if (i < st.pos) sp.className = 'on'; if (i === st.pos) sp.className = 'cur'; tr.appendChild(sp); });
    var kd = $('kind'); kd.textContent = kindLabel(e); kd.className = 'kind ' + e.kind;
    $('tag').textContent = item.tag;
    var card = $('card'); card.className = 'card' + (item.say ? ' say' : '');
    var ch = $('chainHead');
    if (item.steps) {
      ch.classList.remove('hidden');
      ch.innerHTML = item.chain + ' · 第 ' + (st.step + 1) + ' 步 / ' + item.steps.length + ' <span class="dots">' + item.steps.map(function (_, i) { return '<i class="' + (i <= st.step ? 'on' : '') + '"></i>'; }).join('') + '</span>';
    } else ch.classList.add('hidden');
    $('q').textContent = q.q;
    $('altLbl').textContent = item.say ? '他沒接話' : '不知道 → 給他幾個選';
    $('moreLbl').textContent = item.say ? '他接話了' : '說了 → 追問';
    $('alt').textContent = q.alt;
    var extras = q.more || [];
    $('more').innerHTML = (item.say ? '' : '<ol>' + s.probes.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ol>') +
      (extras.length ? '<div class="extra">' + (item.say ? '' : '<b>這題再問：</b>') + extras.join('　') + '</div>' : '');
    ['hAlt', 'hMore'].forEach(function (id) { $(id).classList.remove('open'); $(id).setAttribute('aria-expanded', 'false'); });
    resetTimer();
    var last = st.pos === st.seq.length - 1 && (!item.steps || st.step === item.steps.length - 1);
    var label = item.steps && st.step < item.steps.length - 1 ? '下一步' : (last ? '這段問完了 · 明天再來' : '下一題');
    $('next').innerHTML = label + ' <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    $('draw').disabled = st.pool.length >= s.pool.length;
    if (st.listOpen) renderList();
    save();
  }
  function next() {
    var e = cur();
    if (e.item.steps && st.step < e.item.steps.length - 1) { st.step++; render(); return; }
    if (st.pos >= st.seq.length - 1) { st.pos = 0; st.step = 0; render(); window.scrollTo(0, 0); return; }
    st.pos++; st.step = 0; render();
  }
  function drawOne() {
    var s = st.slot, left = [];
    for (var i = 0; i < s.pool.length; i++) if (st.pool.indexOf(i) < 0) left.push(i);
    if (!left.length) return;
    var pick = left[Math.floor(Math.random() * left.length)];
    var curKind = cur().kind;
    st.pool.push(pick);
    st.seq = buildSeq(s, st.pool);
    // 若已在收尾，插入的補充題放在目前題之前；跳到它
    if (curKind === 'close') { st.pos = st.seq.length - s.close.length - 1; st.step = 0; }
    render();
  }
  function jump(kind, i) {
    var s = st.slot;
    if (kind === 'pool' && st.pool.indexOf(i) < 0) { st.pool.push(i); st.seq = buildSeq(s, st.pool); }
    for (var p = 0; p < st.seq.length; p++) if (st.seq[p].kind === kind && st.seq[p].i === i) { st.pos = p; break; }
    st.step = 0; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderList() {
    var s = st.slot, list = $('list'); list.innerHTML = '';
    function section(title, rows) {
      if (!rows.length) return;
      var h = document.createElement('h4'); h.textContent = title; list.appendChild(h);
      rows.forEach(function (r) { list.appendChild(r); });
    }
    function row(e, label, cls) {
      var d = document.createElement('div'); d.className = 'row' + cls;
      var n = document.createElement('span'); n.className = 'n'; n.textContent = label;
      var b = document.createElement('button');
      b.textContent = e.item.steps ? e.item.chain + '（' + e.item.steps.length + ' 步）' + e.item.steps[0].q : e.item.q;
      b.addEventListener('click', function () { jump(e.kind, e.i); });
      d.appendChild(n); d.appendChild(b); return d;
    }
    var opens = [], pools = [], closes = [];
    st.seq.forEach(function (e, p) {
      var cls = (p < st.pos ? ' done' : '') + (p === st.pos ? ' cur' : '');
      var r = row(e, kindLabel(e).split(' ')[1], cls);
      (e.kind === 'open' ? opens : e.kind === 'pool' ? pools : closes).push(r);
    });
    section('每日開場', opens); section('今天抽到的補充', pools); section('收尾', closes);
    var spare = [];
    s.pool.forEach(function (it, i) { if (st.pool.indexOf(i) < 0) spare.push(row({ kind: 'pool', item: it, i: i }, '＋', ' spare')); });
    section('還沒抽到的補充題（點了就加進今天）', spare);
  }

  function resetTimer() { if (timer) { clearInterval(timer); timer = null; } var c = $('count5'); c.className = 'count5'; c.innerHTML = '數到<br>五'; }
  function startTimer() {
    if (timer) return;
    var c = $('count5'), n = 5; c.className = 'count5 run'; c.textContent = n;
    timer = setInterval(function () { n--; if (n > 0) { c.textContent = n; return; } clearInterval(timer); timer = null; c.className = 'count5 done'; c.innerHTML = '他說了<br>嗎？'; }, 1000);
  }

  // ---------- events ----------
  $('back').addEventListener('click', function () { location.hash = ''; });
  $('next').addEventListener('click', next);
  $('draw').addEventListener('click', drawOne);
  $('count5').addEventListener('click', function () { var c = $('count5'); if (c.classList.contains('done')) resetTimer(); else startTimer(); });
  ['hAlt', 'hMore'].forEach(function (id) { $(id).addEventListener('click', function () { var open = this.classList.toggle('open'); this.setAttribute('aria-expanded', open ? 'true' : 'false'); }); });
  $('toggleList').addEventListener('click', function () {
    st.listOpen = !st.listOpen; $('list').classList.toggle('hidden', !st.listOpen);
    this.classList.toggle('on', st.listOpen); this.textContent = st.listOpen ? '收起題目' : '看全部題目';
    if (st.listOpen) renderList();
  });
  $('reshuffle').addEventListener('click', function () { st.pool = shuffle(st.slot.pool.length).slice(0, DRAW); st.seq = buildSeq(st.slot, st.pool); st.pos = 0; st.step = 0; render(); });

  function route() {
    var m = /^#\/(\w+)/.exec(location.hash);
    if (m && findSlot(m[1])) openSlot(m[1]);
    else { resetTimer(); slotEl.classList.add('hidden'); home.classList.remove('hidden'); }
  }
  window.addEventListener('hashchange', route);
  renderHome();
  route();
})();
</script>
